<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 06</title>
    <link rel="stylesheet" href="q6-ticketChecker.css">
</head>
<body>
    <div class="container">
        <h1>Support Ticket Checker</h1>
        <p>Enter your ticket ID to check its status.</p>

        <input
            type="text"
            id="ticketId"
            placeholder="Enter Ticket ID (e.g. 101, 102, 103)"
        >

        <button id="checkBtn" onclick="checkTicket()">
            Check Status
        </button>

        <div id="result"></div>
    </div>

    
    <script src="q6-ticketChecker.js"></script>
</body>
</html>
