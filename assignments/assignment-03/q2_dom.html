<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 2 - DOM Manipulation with JavaScript</title>
</head>
<body style="font-family: Arial, Helvetica, sans-serif; background-color: #f1f5f9; color: #1f2937; margin: 0; padding: 40px; line-height: 1.6;">

    <!-- Heading with id="title" -->
    <h1 id="title" style="color: #2563eb; font-size: 32px; margin-bottom: 12px;">Welcome to DOM Manipulation</h1>

    <!-- Paragraph with id="message" -->
    <p id="message" style="font-size: 16px; max-width: 500px; margin-bottom: 20px;">This paragraph text will be shown in the console.</p>

    <!-- Button with id="showBtn" -->
    <button id="showBtn" style="background-color: #2563eb; color: #ffffff; border: none; border-radius: 6px; padding: 10px 20px; font-size: 14px; cursor: pointer;">Show Heading Text</button>

    <!-- External JavaScript file -->
    <script src="q2_script.js"></script>
