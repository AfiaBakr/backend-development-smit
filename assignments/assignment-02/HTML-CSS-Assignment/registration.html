<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="registration.css">
</head>
<body>
    <h1>Student Registration Form</h1>
 <form>
    <label for="name">Full Name:</label><br>
    <input type="text" id="name" name="name" required><br><br>

    <label for="email">Email:</label><br>
    <input type="email" id="email" name="email" required><br><br>

    <label for="password">Password:</label><br>
    <input type="password" id="password" name="password" required><br><br>

    <label for="date">Date of Birth:</label><br>
    <input type="date" id="date" name="date"><br><br>

    <label>Gender:</label><br>
    <input type="radio" id="male" name="gender" value="male">
    <label for="male">Male</label>

    <input type="radio" id="female" name="gender" value="female">
    <label for="female">Female</label><br><br>

    <label>Favorite Programming Languages:</label><br>

    <input type="checkbox" id="html" name="language" value="HTML">
    <label for="html">HTML</label><br>

    <input type="checkbox" id="css" name="language" value="CSS">
    <label for="css">CSS</label><br>

    <input type="checkbox" id="javascript" name="language" value="JavaScript">
    <label for="javascript">JavaScript</label><br>

    <input type="checkbox" id="python" name="language" value="Python">
    <label for="python">Python</label><br><br>

    <label for="city">City:</label><br>
    <select id="city" name="city">
        <option value="">Select your city</option>
        <option value="karachi">Karachi</option>
        <option value="lahore">Lahore</option>
        <option value="islamabad">Islamabad</option>
        <option value="peshawar">Peshawar</option>
    </select><br><br>

    <label for="about">About Yourself:</label><br>
    <textarea id="about" name="about" rows="5" cols="40"></textarea><br><br>

    <input type="submit" value="Register">
    <input type="reset" value="Reset">
</form>
</body>
</html>
