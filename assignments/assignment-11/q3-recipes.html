<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 03</title>
    <link rel="stylesheet" href="q3-recipes.css">
</head>
<body>
    <header>
        <h1>🍽️ Recipe Finder</h1>
        <p>Discover delicious meals and find your next favorite recipe!</p>
    </header>

    <main class="container">

        <h2>Explore Recipes</h2>

        <!-- Loading message and HTTP status -->
        <p id="message">Loading recipes...</p>
        <p id="status"></p>

        <!-- Recipe cards will appear here -->
        <div id="recipes-container" class="recipes-grid"></div>

        <!-- Selected recipe ingredients will appear here -->
        <section id="recipe-details" class="recipe-details">
            <h2 id="details-title">Recipe Ingredients</h2>
            <ul id="ingredients-list"></ul>
        </section>

    </main>

    <footer>
        <p>Recipe Finder | Discover. Cook. Enjoy. | By AFIA</p>
    </footer>
    
    <script src="q3-recipes.js"></script>
</body>
</html>
