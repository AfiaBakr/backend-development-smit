<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 04</title>
    <link rel="stylesheet" href="q4-postRequests.css">
</head>
<body>
    <header>
    <h1>API Request Practice</h1>
    <p>Create and Update a Post Using Fetch API</p>
</header>

<main class="container">

    <section class="card">
        <h2>Create a New Post</h2>

        <form id="postForm">
            <label for="title">Post Title</label>
            <input
                type="text"
                id="title"
                placeholder="Enter post title"
                required
            >

            <label for="userId">User ID</label>
            <input
                type="number"
                id="userId"
                placeholder="Enter user ID"
                min="1"
                required
            >

            <label for="content">Post Content</label>
            <textarea
                id="content"
                placeholder="Write your post content"
                rows="4"
                required
            ></textarea>

            <button type="submit">Create Post (POST)</button>
        </form>
    </section>

    <section class="card">
        <h2>Update Existing Post</h2>
        <p>These operations use post ID 1.</p>

        <div class="button-group">
            <button type="button" id="putBtn" class="put-btn">
                Replace Post (PUT)
            </button>

            <button type="button" id="patchBtn" class="patch-btn">
                Update Title (PATCH)
            </button>

            <button type="button" id="deleteBtn" class="delete-btn">
                Delete Post (DELETE)
            </button>
        </div>
    </section>

    <section class="card">
        <h2>API Response</h2>

        <div id="statusMessage" class="status-message">
            Ready to send API requests.
        </div>

        <pre id="responseOutput">Your API response will appear here.</pre>
    </section>

</main>

<footer>
    <p>Practice Project | Fetch API | JSONPlaceholder | By AFIA</p>
</footer>
    
    <script src="q4-postRequests.js"></script>
</body>
</html>
