<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <style>
    table {
      border-collapse: collapse;
      width: 50%;
      margin: 20px auto;
    }
    th, td {
      padding: 10px;
      text-align: left;
    }
    th {
      background-color: #f2f2f2;
    }
  </style>
    <table border="1" solid white>
  <!-- Row 1: Header tags -->
  <tr>
    <th colspan="2">Item</th>
  
    <th>Price</th>
  </tr>
  <!-- Row 2: First data entry -->
  <tr>
    <td rowspan="2">Laptop</td>
    <td>2</td>
    <td>$1,200</td>
  </tr>
  <!-- Row 3: Second data entry -->
  <tr >
    
    <td>5</td>
    <td>$25</td>
  </tr>
</table>

<!-- form -->
 <form>
    <label for="fname">Name:</label>
    <input type="text" id="fname" name="fname" value="Afia"><br><br>
    
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" value="afia@gmail"><br><br>
    <p
>Choose your favorite language:</p>    
    <input type="radio" id="html" name="language" value="HTML">
    <label for="html">HTML</label><br>
    <input type="radio" id="css" name="language" value="CSS">
    <label for="css">CSS</label><br>
    <input type="radio" id="javascript" name="language" value="JavaScript">
    <label for="javascript">JavaScript</label><br><br>
<label for="radio" id="html" name="language" v>Language:</label>
    
<p>choose:</p>

    <input type="checkbox" id="html" name="language" value="HTML">
    <label for="html">HTML</label><br>
    <input type="checkbox" id="css" name="language" value="CSS">
    <label for="css">CSS</label><br>
    <input type="checkbox" id="javascript" name="language" value="JavaScript">
    <label for="javascript">JavaScript</label><br><br>
    
    <p>Choose your favorite Car:</p>
    <select name="cars" id="cars">
      <option value="volvo">Volvo</option>
      <option value="saab">Saab</option>
      <option value="mercedes">Mercedes</option>
      <option value="audi">Audi</option>
    </select><br><br>
    <input type="submit" value="Submit">
    <label for="message">Message:</label><br>
    <textarea id="message" name="message" rows="4" cols="50">
    
    
  </form>
</body>
</html>
